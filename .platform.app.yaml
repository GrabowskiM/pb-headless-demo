name: app
type: 'nodejs:22'

# The production build is committed under dist/, and serve.mjs runs on Node
# built-ins only, so no dependency install or build step is needed here.
build:
    flavor: none

web:
    commands:
        start: 'node serve.mjs'
    upstream:
        socket_family: unix
    locations:
        '/':
            passthru: true

disk: 512
mounts: {}
